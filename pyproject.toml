[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bounty-scout"
version = "0.1.0"
description = "An OpenMinion agent that turns raw crypto/OSS bounty feeds into evidence-backed, ranked shortlists."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
  "openminion>=0.1.17",
  "pydantic>=2",
]

[project.scripts]
bounty-scout = "scout.cli:main"

[tool.setuptools.packages.find]
include = ["scout*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
